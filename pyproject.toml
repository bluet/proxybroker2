[tool.poetry]
name = "proxybroker2"
version = "2.0.0b3"
description = "The New (auto rotate) Proxy [Finder | Checker | Server]. HTTP(S) & SOCKS."
authors = ["BlueT - Matthew Lien - 練喆明 <bluet@bluet.org>", "Denis Constverum <constverum@gmail.com>"]
repository = "https://github.com/bluet/proxybroker2"
homepage = "https://proxybroker2.readthedocs.io/"
documentation = "https://proxybroker2.readthedocs.io/"
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "proxybroker"}]
include = ["proxybroker/data/*.mmdb"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Environment :: Web Environment',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: POSIX',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Topic :: Internet :: WWW/HTTP :: Indexing/Search',
    'Topic :: Internet :: Proxy Servers',
    'License :: OSI Approved :: Apache Software License',

]

# Lower bounds bumped from prior version to clear known vulnerabilities at
# the constraint floor (snyk scans the lower bound when no specific version
# is locked). Notable:
# - click ^8.3.3 fixes SNYK-PYTHON-CLICK-16347201 (HIGH, command injection
#   in click.edit() filename param)
# - aiohttp ^3.13.5 fixes multiple HIGH vulns (SSRF on Windows static
#   handler, memory exhaustion in multipart/Request.post/ZLibDecompressor,
#   request smuggling)
# Other deps bumped to match poetry.lock current resolution for consistency.
[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.13.5"
aiodns = "^3.6.1"
attrs = ">=26.1.0,<27.0.0"
maxminddb = "^2.8.2"
cachetools = "^5.5.2"
click = "^8.3.3"
pyyaml = "^6.0.3"

[tool.poetry.dev-dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^0.26.0"
pytest-mock = "^3.15.1"
pytest-cov = "^6.3.0"
alabaster = "^1.0.0"
# ruff also pinned in .pre-commit-config.yaml; the README's contributor
# workflow uses `poetry run ruff check / format`, so it must be installable
# via `poetry install`. Without this, the CI workflow falls back to
# `poetry run pip install ruff` ad-hoc, but contributors get
# "command not found" on a clean checkout.
ruff = "^0.15.12"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
proxybroker = "proxybroker.cli:cli"

[tool.black]
py36 = true
line-length = 88
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.venv         # virtualenv
    | build
    | dist
  )
)
'''

[tool.ruff]
exclude = ["CRITICAL_FIXES.py"]

[tool.ruff.lint]
# Default selection is E4/E7/E9/F (pycodestyle errors + pyflakes). Add
# PLW1514 to enforce encoding= on text-mode open() calls, preventing the
# locale-encoding data-corruption class of bug caught reactively in PR #210.
# PLW1514 is a preview rule, so preview must be enabled, but
# explicit-preview-rules restricts preview-rule selection to only the rules
# explicitly listed in extend-select.
select = ["E4", "E7", "E9", "F", "PLW1514"]
preview = true
explicit-preview-rules = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
